<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEZ BAYILI — Grossiste en boissons</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; font-family:Arial, sans-serif; }
body{ background:#f4f5f7; color:#222; }
header{ background:#111827; color:white; padding:15px; position:sticky; top:0; z-index:100; }
.header-cnt{ max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center; }
.logo{ font-size:22px; font-weight:bold; }
.logo span{ color:#f59e0b; }
.btns button{ padding:8px 12px; font-weight:bold; border-radius:6px; border:none; cursor:pointer; }
.btn-cart{ background:#f59e0b; color:#111; }
.btn-admin{ background:#fff; color:#111; margin-left:5px; }

.hero{ background:#1f2937; color:white; padding:30px 15px; text-align:center; }
.container{ max-width:1200px; margin:20px auto; padding:0 15px; }

.search-box{ margin-bottom:15px; }
.search-box input{ width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font-size:16px; }

.categories{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:20px; }
.cat-btn{ padding:8px 15px; border-radius:20px; border:1px solid #ccc; background:#fff; cursor:pointer; white-space:nowrap; }
.cat-btn.active{ background:#111827; color:white; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:15px; }
.card{ background:white; border-radius:10px; padding:15px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.card-img{ height:140px; background:#e5e7eb; border-radius:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:10px; }
.card-img img{ width:100%; height:100%; object-fit:cover; }
.card-img span{ font-size:50px; }
.card h3{ font-size:16px; margin-bottom:5px; }
.card-cat{ font-size:12px; color:#666; margin-bottom:8px; }
.card-price{ font-weight:bold; font-size:18px; margin-bottom:10px; color:#111827; }
.card-btn{ padding:10px; background:#f59e0b; border:none; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; }

/* ADMIN & MODAL */
.admin-panel{ background:white; padding:20px; border-radius:10px; margin-bottom:20px; display:none; border:2px solid #111827; }
.admin-panel.open{ display:block; }
.form-grp{ margin-bottom:10px; }
.form-grp input, .form-grp select{ width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; }

.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:200; padding:15px; }
.modal.open{ display:flex; }
.modal-box{ background:white; padding:20px; border-radius:10px; max-width:500px; width:100%; max-height:85vh; overflow-y:auto; }
.cart-item{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:8px; }
.btn-wa{ background:#22c55e; color:white; padding:12px; width:100%; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:15px; font-size:16px; }
.admin-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee; }
</style>
</head>
<body>

<header>
  <div class="header-cnt">
    <div class="logo">CHEZ <span>BAYILI</span></div>
    <div class="btns">
      <button class="btn-cart" onclick="openCart()">🛒 Panier (<span id="cartCnt">0</span>)</button>
      <button class="btn-admin" onclick="loginAdmin()">⚙️ Admin</button>
    </div>
  </div>
</header>

<section class="hero">
  <h2>CHEZ BAYILI — Grossiste en boissons</h2>
  <p>Consultez notre catalogue et passez vos commandes directement par WhatsApp.</p>
</section>

<main class="container">

  <!-- PANNEAU ADMIN -->
  <section class="admin-panel" id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3>⚙️ Administration Commerçant</h3>
      <button onclick="closeAdmin()" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Fermer</button>
    </div>
    
    <form id="addForm">
      <div class="form-grp"><input type="text" id="pName" placeholder="Nom de la boisson" required></div>
      <div class="form-grp">
        <select id="pCat" required>
          <option value="">Sélectionner une catégorie</option>
          <option value="Bières">Bières</option>
          <option value="Sucreries">Sucreries</option>
          <option value="Énergisantes">Énergisantes</option>
          <option value="Eau">Eau</option>
          <option value="Jus">Jus</option>
          <option value="Vins">Vins</option>
          <option value="Spiritueux">Spiritueux</option>
        </select>
      </div>
      <div class="form-grp"><input type="text" id="pFormat" placeholder="Format (ex: 65 cl / Casier de 12)" required></div>
      <div class="form-grp"><input type="number" id="pPrice" placeholder="Prix (FCFA)" required></div>
      <div class="form-grp">
        <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">Photo du produit (fichiers) :</label>
        <input type="file" id="pFile" accept="image/*">
      </div>
      <button type="submit" style="padding:10px; background:#111827; color:white; border:none; border-radius:6px; cursor:pointer; width:100%; font-weight:bold;">Ajouter le produit</button>
    </form>
    
    <hr style="margin:20px 0;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4>Produits en stock</h4>
      <button onclick="resetData()" style="background:#dc2626; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Réinitialiser Tout</button>
    </div>
    <div id="adminList" style="margin-top:10px;"></div>
  </section>

  <!-- CATALOGUE -->
  <div class="search-box">
    <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔎 Rechercher une boisson...">
  </div>

  <div class="categories" id="catList"></div>
  <div class="grid" id="productGrid"></div>

</main>

<!-- MODAL PANIER -->
<div class="modal" id="cartModal">
  <div class="modal-box">
    <h3>🛒 Votre Panier</h3>
    <br>
    <div id="cartList"></div>
    <div style="font-size:18px; font-weight:bold; margin-top:15px; text-align:right;">
      Total: <span id="cartTotal">0</span> FCFA
    </div>
    <hr style="margin: 15px 0;">
    <input type="text" id="clientName" placeholder="Votre nom complet" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:6px;">
    <input type="text" id="clientLoc" placeholder="Lieu de livraison" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:6px;">
    <button class="btn-wa" onclick="sendWhatsApp()">Commander sur WhatsApp</button>
    <button onclick="closeCart()" style="width:100%; padding:8px; margin-top:5px; background:none; border:none; cursor:pointer; color:#666;">Fermer</button>
  </div>
</div>

<script>
const PHONE_NUMBER = "22600000000"; // Votre numéro WhatsApp
const ADMIN_PASS = "admin1234";     // Mot de passe Administrateur

const defaultProducts = [
  { id: 1, name: "Brakina", cat: "Bières", format: "65 cl - Casier de 12", price: 6500, img: "" },
  { id: 2, name: "Beaufort Lager", cat: "Bières", format: "50 cl - Casier de 12", price: 7000, img: "" },
  { id: 3, name: "Guinness", cat: "Bières", format: "33 cl - Casier de 24", price: 14000, img: "" },
  { id: 4, name: "Castel Beer", cat: "Bières", format: "65 cl - Casier de 12", price: 6500, img: "" },
  { id: 5, name: "Flag Spéciale", cat: "Bières", format: "50 cl - Casier de 12", price: 7000, img: "" },
  { id: 6, name: "Coca-Cola", cat: "Sucreries", format: "50 cl - Casier de 24", price: 6000, img: "" },
  { id: 7, name: "Fanta Orange", cat: "Sucreries", format: "50 cl - Casier de 24", price: 6000, img: "" },
  { id: 8, name: "Sprite", cat: "Sucreries", format: "50 cl - Casier de 24", price: 6000, img: "" },
  { id: 9, name: "XXL Energy", cat: "Énergisantes", format: "33 cl - Carton de 24", price: 7500, img: "" },
  { id: 10, name: "Red Bull", cat: "Énergisantes", format: "25 cl - Carton de 24", price: 18000, img: "" },
  { id: 11, name: "Eau Lafi", cat: "Eau", format: "1.5L - Pack de 6", price: 1750, img: "" },
  { id: 12, name: "Jus Ceres Orange", cat: "Jus", format: "1L - Carton de 12", price: 13000, img: "" }
];

let products = [];
try {
  const saved = localStorage.getItem('bayili_db_v4');
  if (saved) products = JSON.parse(saved);
} catch(e) {}

if (!products || products.length === 0) {
  products = defaultProducts;
  localStorage.setItem('bayili_db_v4', JSON.stringify(products));
}

let cart = [];
let activeCat = "Toutes";

function render() {
  // Catégories
  const cats = ["Toutes", ...new Set(products.map(p => p.cat))];
  document.getElementById('catList').innerHTML = cats.map(c => 
    `<button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');

  // Recherche & Filtre
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = products.filter(p => {
    const matchCat = activeCat === "Toutes" || p.cat === activeCat;
    const matchSearch = p.name.toLowerCase().includes(query);
    return matchCat && matchSearch;
  });

  // Grille
  const grid = document.getElementById('productGrid');
  if (filtered.length === 0) {
    grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; padding:30px;'>Aucune boisson trouvée.</p>";
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="card-img">
        ${p.img ? `<img src="${p.img}">` : `<span>🍾</span>`}
      </div>
      <div>
        <h3>${p.name}</h3>
        <div class="card-cat">${p.cat} • ${p.format}</div>
        <div class="card-price">${p.price.toLocaleString()} FCFA</div>
      </div>
      <button class="card-btn" onclick="addToCart(${p.id})">🛒 Ajouter au panier</button>
    </div>
  `).join('');
}

function setCategory(c) {
  activeCat = c;
  render();
}

function filterProducts() {
  render();
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  const item = cart.find(x => x.id === id);
  if (item) item.qty++;
  else cart.push({...p, qty: 1});
  updateCart();
}

function updateCart() {
  const count = cart.reduce((sum, i) => sum + i.qty, 0);
  const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  
  document.getElementById('cartCnt').textContent = count;
  document.getElementById('cartTotal').textContent = total.toLocaleString();

  document.getElementById('cartList').innerHTML = cart.length === 0 ? "<p>Panier vide.</p>" : cart.map(i => `
    <div class="cart-item">
      <div><strong>${i.name}</strong><br>${i.price.toLocaleString()} FCFA x ${i.qty}</div>
      <div>
        <button onclick="changeQty(${i.id}, 1)" style="padding:4px 8px;">+</button>
        <button onclick="changeQty(${i.id}, -1)" style="padding:4px 8px;">-</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta) {
  const item = cart.find(x => x.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
  updateCart();
}

function openCart() { document.getElementById('cartModal').classList.add('open'); }
function closeCart() { document.getElementById('cartModal').classList.remove('open'); }

function loginAdmin() {
  const pass = prompt("Mot de passe Administrateur :");
  if (pass === ADMIN_PASS) {
    document.getElementById('adminPanel').classList.add('open');
    renderAdmin();
  } else if (pass !== null) {
    alert("Mot de passe incorrect.");
  }
}

function closeAdmin() { document.getElementById('adminPanel').classList.remove('open'); }

function renderAdmin() {
  document.getElementById('adminList').innerHTML = products.map(p => `
    <div class="admin-item">
      <div><strong>${p.name}</strong> (${p.price} FCFA)</div>
      <button onclick="deleteProduct(${p.id})" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">Supprimer</button>
    </div>
  `).join('');
}

function deleteProduct(id) {
  products = products.filter(p => p.id !== id);
  localStorage.setItem('bayili_db_v4', JSON.stringify(products));
  render();
  renderAdmin();
}

function resetData() {
  if (confirm("Réinitialiser toutes les données ?")) {
    products = defaultProducts;
    localStorage.setItem('bayili_db_v4', JSON.stringify(products));
    render();
    renderAdmin();
  }
}

document.getElementById('addForm').onsubmit = function(e) {
  e.preventDefault();
  const file = document.getElementById('pFile').files[0];
  
  const save = (imgData) => {
    const newP = {
      id: Date.now(),
      name: document.getElementById('pName').value,
      cat: document.getElementById('pCat').value,
      format: document.getElementById('pFormat').value,
      price: parseInt(document.getElementById('pPrice').value),
      img: imgData || ""
    };
    products.push(newP);
    localStorage.setItem('bayili_db_v4', JSON.stringify(products));
    render();
    renderAdmin();
    this.reset();
    alert("Produit ajouté avec succès !");
  };

  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => save(ev.target.result);
    reader.readAsDataURL(file);
  } else {
    save("");
  }
};

function sendWhatsApp() {
  if (cart.length === 0) return alert("Panier vide !");
  const name = document.getElementById('clientName').value;
  const loc = document.getElementById('clientLoc').value;

  let msg = `Bonjour CHEZ BAYILI, commande de ${name || 'Client'}\n`;
  if (loc) msg += `Lieu: ${loc}\n`;
  msg += `\nCommandes:\n`;
  cart.forEach(i => { msg += `- ${i.name} x${i.qty} = ${i.price * i.qty} FCFA\n`; });
  
  const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  msg += `\nTotal: ${total} FCFA`;

  window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

// Lancement automatique
render();
</script>
</body>
  </html>
